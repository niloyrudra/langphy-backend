apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
spec:
  template:
    spec:
      containers:
        - name: kafka-init
          image: confluentinc/cp-kafka
          command:
            - sh
            - -c
            - |
              kafka-topics --bootstrap-server kafka-srv:9092 \
              --create --if-not-exists --topic user.registered.v1 \
              --partitions 3 --replication-factor 1
      restartPolicy: OnFailure