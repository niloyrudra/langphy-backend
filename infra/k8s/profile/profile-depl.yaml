apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: profile
  template:
    metadata:
      labels:
        app: profile
    spec:
      containers:
        - name: profile
          image: niloyrudra/profile
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: profile-secrets
                  key: PG_HOST
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: profile-secrets
                  key: PG_PORT
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: profile-secrets
                  key: PG_USER
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: profile-secrets
                  key: PG_PASSWORD
            - name: PG_DB
              valueFrom:
                secretKeyRef:
                  name: profile-secrets
                  key: PG_DB
---
apiVersion: v1
kind: Service
metadata:
  name: profile-srv
spec:
  selector:
    app: profile
  ports:
    - name: profile
      protocol: TCP
      port: 3004
      targetPort: 3004


