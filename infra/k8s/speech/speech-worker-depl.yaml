apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech-worker-depl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: speech-worker
  template:
    metadata:
      labels:
        app: speech-worker
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox
          command: ['sh', '-c', 'until nc -z redis 6379; do echo waiting; sleep 2; done']
      containers:
        - name: speech-worker
          image: niloyrudra/speech-service
          imagePullPolicy: IfNotPresent
          command: ["python"]
          args: ["app/worker.py"]
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: NLP_SERVICE_URL
              value: http://nlp-srv:8000

          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"