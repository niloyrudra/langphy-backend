apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speech
  template:
    metadata:
      labels:
        app: speech
    spec:
      containers:
        - name: speech
          image: niloyrudra/speech-service
          imagePullPolicy: IfNotPresent
          env:
            - name: NLP_SERVICE_URL
              value: http://nlp-srv:8000
          ports:
            - containerPort: 8001

          resources:
            requests:
              cpu: "1000m" # "250m"
              memory: "1Gi" # "512Mi"
            limits:
              cpu: "4000m" # "1000m"
              memory: "4Gi" # "2Gi"

          # readinessProbe:
          #   httpGet:
          #     path: /health
          #     port: 8001
          #   initialDelaySeconds: 90
          #   periodSeconds: 15
          #   timeoutSeconds: 5
          #   failureThreshold: 5

          # livenessProbe:
          #   httpGet:
          #     path: /health
          #     port: 8001
          #   initialDelaySeconds: 180
          #   periodSeconds: 20
          #   timeoutSeconds: 5
          #   failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /docs
              port: 8001
            initialDelaySeconds: 180 # model may take time to load
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 5

          livenessProbe:
            httpGet:
              path: /docs
              port: 8001
            initialDelaySeconds: 300   # Give pod 5min before first probe
            timeoutSeconds: 5          # Allow long processing
            periodSeconds: 60          # Check only every 60s
            failureThreshold: 5        # Require multiple failures to restart
---
apiVersion: v1
kind: Service
metadata:
  name: speech-srv
spec:
  selector:
    app: speech
  ports:
    - name: http
      protocol: TCP
      port: 8001
      targetPort: 8001
