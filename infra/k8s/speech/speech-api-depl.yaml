apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech-api-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speech-api
  template:
    metadata:
      labels:
        app: speech-api
    spec:
      containers:
        - name: speech-api
          image: niloyrudra/speech-service
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["app.main:app", "--host", "0.0.0.0", "--port", "8001"]

          env:
            - name: REDIS_HOST
              value: redis
            - name: NLP_SERVICE_URL
              value: http://nlp-srv:8000
            - name: REDIS_PORT
              value: "6379"
            - name: WHISPER_MODEL_SIZE
              value: small
            - name: WHISPER_DEVICE
              value: cpu
            - name: WHISPER_COMPUTE_TYPE
              value: int8
            - name: WHISPER_NUM_WORKERS
              value: "2"
            - name: HF_HOME
              value: /root/.cache/huggingface

          ports:
            - containerPort: 8001

          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"

          # ── Readiness probe ────────────────────────────────────────────────
          # Kubernetes will NOT route any traffic to this pod until
          # /health/ready returns 200.  That endpoint only returns 200 after
          # load_model() has fully completed (including warm-up inference).
          # This is the critical gate that eliminates the 60-second first request.
          readinessProbe:
            httpGet:
              path: /docs #/health/ready
              port: 8001
            initialDelaySeconds: 30   # give load_model() a head start
            periodSeconds: 5
            failureThreshold: 12      # 30 + 12*5 = 90 s max wait

          livenessProbe:
            httpGet:
              path: /docs #/health/live
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3

          # readinessProbe:
          #   httpGet:
          #     path: /docs
          #     port: 8001
          #   initialDelaySeconds: 20
          #   periodSeconds: 15

          # livenessProbe:
          #   httpGet:
          #     path: /docs
          #     port: 8001
          #   initialDelaySeconds: 40
          #   periodSeconds: 30
          
          volumeMounts:
            - name: audio-storage
              mountPath: /tmp
            - name: model-cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: audio-storage
          persistentVolumeClaim:
            claimName: audio-pvc
        - name: model-cache
          persistentVolumeClaim:
            claimName: whisper-model-cache-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: speech-api-srv
spec:
  selector:
    app: speech-api
  ports:
    - name: http
      protocol: TCP
      port: 8001
      targetPort: 8001