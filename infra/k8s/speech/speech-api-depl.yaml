apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech-api-depl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: speech-api
  template:
    metadata:
      labels:
        app: speech-api
    spec:
      containers:
        - name: speech-api
          image: niloyrudra/speech-service
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["app.main:app", "--host", "0.0.0.0", "--port", "8001"]

          env:
            - name: REDIS_HOST
              value: redis-srv
            - name: NLP_SERVICE_URL
              value: http://nlp-srv:8000

          ports:
            - containerPort: 8001

          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          readinessProbe:
            httpGet:
              path: /docs
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 15

          livenessProbe:
            httpGet:
              path: /docs
              port: 8001
            initialDelaySeconds: 40
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: speech-api-srv
spec:
  selector:
    app: speech-api
  ports:
    - port: 8001
      targetPort: 8001