apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-depl
spec:
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      initContainers:
        - name: db-migrate
          image: niloyrudra/auth
          command: [ "node", "dist/db/migrate.js" ]
          envFrom:
            - secretRef:
                name: auth-secrets

      containers:
        - name: auth
          image: niloyrudra/auth
          env:
            - name: SERVICE_NAME
              value: auth-service
            
            - name: KAFKA_BROKER
              value: "kafka-srv:9092"

            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: PG_HOST

            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: PG_PORT

            - name: PG_DB
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: PG_DB

            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: PG_USER

            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: PG_PASSWORD
                  
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: JWT_KEY

            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: RESEND_API_KEY
          
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
          # Ensuring pods restart if Kafka is down
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-srv
spec:
  selector:
    app: auth
  ports:
    - name: auth
      protocol: TCP
      port: 3000
      targetPort: 3000