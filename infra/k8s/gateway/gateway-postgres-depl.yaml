apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-postgres-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-postgres
  template:
    metadata:
      labels:
        app: gateway-postgres
    spec:
      containers:
        - name: gateway-postgres
          image: postgres:15
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: POSTGRES_PASSWORD
                  
          volumeMounts:
            - name: gateway-postgres-srv # postgres-data
              mountPath: /var/lib/postgresql/data
      # volumes:
      #   - name: postgres-data
      #     emptyDir: {}
      volumes:
        - name: gateway-postgres-srv
          persistentVolumeClaim:
            claimName: gateway-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-postgres-srv
spec:
  selector:
    app: gateway-postgres
  ports:
    - name: db
      protocol: TCP
      port: 5432
      targetPort: 5432