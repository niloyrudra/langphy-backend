apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
        - name: db-migrate
          image: niloyrudra/gateway-service
          command: [ "node", "dist/db/migrate.js" ]
          envFrom:
            - secretRef:
                name: gateway-secrets

      containers:
        - name: gateway
          image: niloyrudra/gateway-service
          ports:
            - containerPort: 3009

          env:
            - name: SERVICE_NAME
              value: gateway-service
            
            - name: KAFKA_BROKER
              value: "kafka-srv:9092"

            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: PG_HOST
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: PG_PORT
            - name: PG_DB
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: PG_DB
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: PG_USER
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: PG_PASSWORD
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: JWT_KEY
          
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
          # Ensuring pods restart if Kafka is down
          readinessProbe:
            tcpSocket:
              port: 3009
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 3009
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-srv
spec:
  selector:
    app: gateway
  ports:
    - port: 3009
      targetPort: 3009