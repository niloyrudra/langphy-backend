apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: niloyrudra/gateway-service
          ports:
            - containerPort: 3009

          env:
            - name: SERVICE_NAME
              value: gateway-service

            - name: KAFKA_BROKERS
              value: kafka:9092

            - name: NODE_ENV
              value: production

            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: JWT_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-srv
spec:
  selector:
    app: gateway
  ports:
    - port: 3009
      targetPort: 3009